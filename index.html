
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Love Scanner - Relationship Attachment Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #050505;
        color: #f5f5f5;
        overflow-x: hidden;
      }
      .mesh-bg {
        background-color: #050505;
        background-image: 
          radial-gradient(at 0% 0%, hsla(353,70%,15%,1) 0, transparent 50%), 
          radial-gradient(at 100% 0%, hsla(152,70%,10%,1) 0, transparent 50%),
          radial-gradient(at 50% 100%, hsla(45,70%,5%,1) 0, transparent 50%);
        background-attachment: fixed;
      }
      .glass {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
      }
      .shimmer {
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        background-size: 200% 100%;
        animation: shimmer 3s infinite;
      }
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      @keyframes slow-pan {
        0% { background-position: 0% 0%; }
        50% { background-position: 100% 100%; }
        100% { background-position: 0% 0%; }
      }
      .animate-slow-pan {
        animation: slow-pan 20s ease infinite;
      }
      .text-gradient-shimmer {
        background: linear-gradient(to right, #ffffff 20%, #666666 40%, #666666 60%, #ffffff 80%);
        background-size: 200% auto;
        color: #000;
        background-clip: text;
        text-fill-color: transparent;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shine 5s linear infinite;
      }
      @keyframes shine {
        to { background-position: 200% center; }
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "@google/genai": "https://esm.sh/@google/genai@^1.35.0"
      }
    }
    </script>
  </head>
  <body class="mesh-bg min-h-screen selection:bg-red-500 selection:text-white">
    <div id="root"></div>
  </body>
</html>
